<style>

    line-height: 1.5;

    word-break: break-all;
    color: var(--text);
    user-select: all;

  button {
    margin-top: 14px;

    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid rgba(212,175,102,0.45);
    background: var(--gold);
    color: #16161a;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  button:active { opacity: 0.85; }
  .copied {
    margin-top: 10px;
    font-size: 12px;
    color: #62c894;
    min-height: 16px;
  }
  footer {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--hairline);
  }
  footer a {
    color: var(--ice);
    font-size: 12px;
    text-decoration: none;
  }
  footer a:hover { text-decoration: underline; }

<script>
function copyAddress() {
  var text = document.getElementById('address').textContent;
  var msg = document.getElementById('copiedMsg');
  function shown() {
    msg.textContent = 'Скопировано / Copied';
    setTimeout(function() { msg.textContent = ''; }, 2000);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(shown, fallbackCopy);
  } else {
    fallbackCopy();
  }
  function fallbackCopy() {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); shown(); } catch (e) {}
    document.body.removeChild(ta);
  }
}
</script>
