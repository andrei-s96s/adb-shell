name: Build

on:
  push:
    branches: [ main ]
    paths-ignore: [ 'desktop/**' ]
  pull_request:
    branches: [ main ]
    paths-ignore: [ 'desktop/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build (debug)
        run: swift build -v

      - name: Run tests
        run: swift test -v

      - name: Build (release)
        run: swift build -c release -v

      - name: Package .app
        run: |
          chmod +x build_app.sh
          ./build_app.sh
