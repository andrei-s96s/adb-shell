name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ windows-latest, macos-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck

      # `npm test` runs build+test as one shell invocation (see
      # package.json) — it also passes node --test an explicit
      # dist/test/*.test.js glob rather than the bare dist/test directory,
      # after CI hit "Cannot find module dist/test" on macos-latest with
      # Node 22 that never reproduced locally on Node 26. Passing an
      # explicit file list sidesteps whatever Node-version difference in
      # directory-argument resolution caused that.
      - name: Build and test
        run: npm test

      # Реальная упаковка (не только tsc) — NSIS-инсталлятор на Windows,
      # .app в zip (universal x86_64+arm64) на macOS, AppImage на Linux. Без
      # подписи (нет сертификата) — Windows SmartScreen/macOS Gatekeeper
      # предупредят при первом запуске (AppImage такого предупреждения не
      # показывает, у Linux нет аналога Gatekeeper/SmartScreen).
      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run dist:win

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run dist:linux

      - name: Upload packaged app
        uses: actions/upload-artifact@v4
        with:
          name: adb-shell-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.zip
            release/*.AppImage
          if-no-files-found: error
