name: Desktop Release

# Отдельный тег-неймспейс (desktop-v*.*.*), не пересекается с релизами
# Swift-версии (v*.*.*) — это два независимо версионируемых продукта в
# одном репозитории (см. desktop/PLAN.md).
on:
  push:
    tags:
      - "desktop-v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (например desktop-v0.1.0)"
        required: true

jobs:
  release:
    strategy:
      matrix:
        os: [ windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run dist:win

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ADB Shell Desktop ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            desktop/release/*.exe
            desktop/release/*.zip
