name: Release

# До версии 1.0.0 в этом репозитории жили два независимо версионируемых
# продукта (Swift-версия — "v*.*.*", Electron-порт — "desktop-v*.*.*").
# С 1.0.0 клиент один, схема тегов тоже одна.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (например v1.0.0)"
        required: true

jobs:
  release:
    strategy:
      matrix:
        os: [ windows-latest, macos-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # См. комментарий в build.yml -- тот же принцип кэширования.
      - name: Cache vendor binaries (adb/aapt2/scrcpy)
        uses: actions/cache@v6
        with:
          path: |
            vendor
            .cache
          key: vendor-${{ runner.os }}-${{ hashFiles('scripts/fetch-aapt2.js', 'scripts/fetch-scrcpy.js', 'scripts/fetch-adb.js') }}

      - name: Install dependencies
        run: npm ci

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run dist:win

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run dist:linux

      # Контрольные суммы -- приложение (updateInstaller.ts) сверяет их перед
      # запуском скачанного файла обновления: HTTPS защищает канал
      # скачивания, но не защищает от компрометации самого релиза (утёкший
      # токен публикации, ошибка при аплоаде), а на Windows скачанный .exe
      # запускается сразу без единого подтверждения пользователя. Через
      # node (не shasum/sha256sum — их набор отличается между Windows/macOS/
      # Linux раннерами), <файл>.sha256 рядом с каждым уже собранным файлом,
      # чтобы не зависеть от общего SHA256SUMS.txt при аплоаде из трёх
      # независимых job'ов матрицы (у каждой job — только её собственные
      # файлы в release/).
      - name: Generate checksums
        shell: bash
        run: |
          for f in release/*.exe release/*.zip release/*.AppImage; do
            [ -f "$f" ] || continue
            node -e "const fs=require('fs');const crypto=require('crypto');const h=crypto.createHash('sha256').update(fs.readFileSync(process.argv[1])).digest('hex');fs.writeFileSync(process.argv[1]+'.sha256', h+'\n');" "$f"
          done

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ADB Shell ${{ steps.tag.outputs.tag }}
          files: |
            release/*.exe
            release/*.zip
            release/*.AppImage
            release/*.sha256

      # Курируемые заметки из CHANGELOG.md вместо generate_release_notes:
      # true (сырой список коммитов без единого объяснения, зачем что-то
      # менялось, вперемешку с чисто внутренним рефакторингом, который
      # пользователю релиза не интересен). Падает явно (см.
      # changelog-extract.js), если для этой версии нет секции в
      # CHANGELOG.md -- значит, кто-то забыл перенести [Unreleased] в
      # версионную секцию перед тегом, и лучше остановить релиз, чем
      # опубликовать его без заметок.
      #
      # Отдельный шаг ПОСЛЕ Publish release (не body: в том же шаге) и
      # только на одном плече матрицы -- та же причина, по которой раньше
      # generate_release_notes был ограничен одним plecom: три параллельные
      # job'ы матрицы обновляют ОДИН и тот же релиз, повторный вызов с тем
      # же body на каждой из них -- лишний риск наткнуться на то же
      # утроение, что уже было с автогенерацией.
      - name: Set release notes from CHANGELOG.md
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          version="${{ steps.tag.outputs.tag }}"
          version="${version#v}"
          node scripts/changelog-extract.js "$version" > changelog-section.md

      - name: Publish release notes
        if: matrix.os == 'ubuntu-latest'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          body_path: changelog-section.md
