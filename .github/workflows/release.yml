name: Release

# До версии 1.0.0 в этом репозитории жили два независимо версионируемых
# продукта (Swift-версия — "v*.*.*", Electron-порт — "desktop-v*.*.*").
# С 1.0.0 клиент один, схема тегов тоже одна.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (например v1.0.0)"
        required: true

jobs:
  release:
    strategy:
      matrix:
        os: [ windows-latest, macos-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # См. комментарий в build.yml -- тот же принцип кэширования.
      - name: Cache vendor binaries (adb/aapt2/scrcpy)
        uses: actions/cache@v7
        with:
          path: |
            vendor
            .cache
          key: vendor-${{ runner.os }}-${{ hashFiles('scripts/fetch-aapt2.js', 'scripts/fetch-scrcpy.js', 'scripts/fetch-windows-adb.js') }}

      - name: Install dependencies
        run: npm ci

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run dist:win

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run dist:linux

      # Контрольные суммы -- приложение (updateInstaller.ts) сверяет их перед
      # запуском скачанного файла обновления: HTTPS защищает канал
      # скачивания, но не защищает от компрометации самого релиза (утёкший
      # токен публикации, ошибка при аплоаде), а на Windows скачанный .exe
      # запускается сразу без единого подтверждения пользователя. Через
      # node (не shasum/sha256sum — их набор отличается между Windows/macOS/
      # Linux раннерами), <файл>.sha256 рядом с каждым уже собранным файлом,
      # чтобы не зависеть от общего SHA256SUMS.txt при аплоаде из трёх
      # независимых job'ов матрицы (у каждой job — только её собственные
      # файлы в release/).
      - name: Generate checksums
        shell: bash
        run: |
          for f in release/*.exe release/*.zip release/*.AppImage; do
            [ -f "$f" ] || continue
            node -e "const fs=require('fs');const crypto=require('crypto');const h=crypto.createHash('sha256').update(fs.readFileSync(process.argv[1])).digest('hex');fs.writeFileSync(process.argv[1]+'.sha256', h+'\n');" "$f"
          done

      - name: Determine tag
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ADB Shell ${{ steps.tag.outputs.tag }}
          # Три ОС в матрице -- три отдельные джобы, каждая по очереди вызывает
          # этот шаг. При generate_release_notes: true на всех трёх экшен
          # каждый раз подтягивает уже обновлённое предыдущей джобой тело
          # релиза и дописывает сгенерированные заметки заново -- в итоге
          # "Full Changelog: ..." повторялся в теле релиза 3 раза (по разу на
          # ОС). Генерируем заметки только на одном плече матрицы -- этого
          # достаточно, заметки не зависят от того, под какой ОС собран файл.
          generate_release_notes: ${{ matrix.os == 'ubuntu-latest' }}
          files: |
            release/*.exe
            release/*.zip
            release/*.AppImage
            release/*.sha256
