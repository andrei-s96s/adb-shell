name: Desktop Build

on:
  push:
    branches: [ main ]
    paths: [ 'desktop/**', '.github/workflows/desktop-build.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'desktop/**', '.github/workflows/desktop-build.yml' ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: node --test dist/test
