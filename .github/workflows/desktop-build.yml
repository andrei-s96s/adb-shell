name: Desktop Build

on:
  push:
    branches: [ main ]
    paths: [ 'desktop/**', '.github/workflows/desktop-build.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'desktop/**', '.github/workflows/desktop-build.yml' ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck

      # Build+test in one shell invocation (not separate steps) — CI hit a
      # spurious "Cannot find module dist/test" on macos-latest when the
      # build and the test run were separate steps, immediately after a
      # Build step that had already printed its success output. Could not
      # reproduce locally (fresh clone, repeated runs) even matching the
      # exact commit — looked like a step-boundary/filesystem-timing quirk
      # on the hosted runner rather than a real build bug. `npm test` does
      # the same "build && node --test dist/test" as a single process, so
      # there is no step boundary left for that race to occur across.
      - name: Build and test
        run: npm test
