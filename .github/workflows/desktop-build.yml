name: Desktop Build

on:
  push:
    branches: [ main ]
    paths: [ 'desktop/**', '.github/workflows/desktop-build.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'desktop/**', '.github/workflows/desktop-build.yml' ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck

      # `npm test` runs build+test as one shell invocation (see
      # package.json) — it also passes node --test an explicit
      # dist/test/*.test.js glob rather than the bare dist/test directory,
      # after CI hit "Cannot find module dist/test" on macos-latest with
      # Node 22 that never reproduced locally on Node 26. Passing an
      # explicit file list sidesteps whatever Node-version difference in
      # directory-argument resolution caused that.
      - name: Build and test
        run: npm test
