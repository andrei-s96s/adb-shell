name: Desktop Build

on:
  push:
    branches: [ main ]
    paths: [ 'desktop/**', '.github/workflows/desktop-build.yml' ]
  pull_request:
    branches: [ main ]
    paths: [ 'desktop/**', '.github/workflows/desktop-build.yml' ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck

      # `npm test` runs build+test as one shell invocation (see
      # package.json) — it also passes node --test an explicit
      # dist/test/*.test.js glob rather than the bare dist/test directory,
      # after CI hit "Cannot find module dist/test" on macos-latest with
      # Node 22 that never reproduced locally on Node 26. Passing an
      # explicit file list sidesteps whatever Node-version difference in
      # directory-argument resolution caused that.
      - name: Build and test
        run: npm test

      # Реальная упаковка (не только tsc) — NSIS-инсталлятор на Windows,
      # .app в zip на macOS. Без подписи (нет сертификата) — тот же посыл,
      # что и у текущей неподписанной Swift-версии.
      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run dist:win

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run dist:mac

      - name: Upload packaged app
        uses: actions/upload-artifact@v4
        with:
          name: adb-shell-desktop-${{ matrix.os }}
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
          if-no-files-found: error
